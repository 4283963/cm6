server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/fx_settlement
spring.datasource.username=kl
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.com.crossborder.fx=DEBUG

fx.risk.default-exposure-limit-cny=1000000
fx.risk.circuit-breaker-threshold=0.9
fx.rate.cache-duration-seconds=30
fx.rate.simulation-mode=true
fx.settlement.instant-mode=false
