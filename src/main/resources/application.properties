server.port=8081

spring.datasource.url=jdbc:h2:mem:fx_settlement;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.crossborder.fx=DEBUG

fx.risk.default-exposure-limit-cny=1000000
fx.risk.circuit-breaker-threshold=0.9
fx.rate.cache-duration-seconds=30
fx.rate.simulation-mode=true
fx.settlement.instant-mode=false
